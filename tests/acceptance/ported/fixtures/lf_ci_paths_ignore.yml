name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes run no CI (#271). Keep in step with DOCS_ONLY in scripts/ci_paths.py:
    # Deploy treats exactly these paths as docs when it compares code trees. PRs stay unfiltered.
    paths-ignore:
      - "docs/**"
      - "courses/**"
      - ".claude/**"
      - "history.md"
