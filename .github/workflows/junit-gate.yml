# Reusable JUnit gate: the exam job runs the caller's exam command and uploads
# the report; the gate job, which never checks out the caller, fails on a
# missing, empty, skipped, failed or errored report.
#
# Caller:
#   jobs:
#     acceptance:
#       uses: Shashkist/factory/.github/workflows/junit-gate.yml@<commit-sha>
#       with:
#         test-command: uv run pytest tests/acceptance -q --junitxml=acceptance.xml
#
# The exam job sets PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 by default, so a code
# commit cannot auto-register an installed pytest plugin that rewrites results
# (an explicit `-p` in the caller's pytest config still loads one). A caller whose
# exam needs an installed plugin (pytest-asyncio, pytest-xdist, ...) either
# loads it explicitly (`pytest -p <plugin>`) or passes
# `disable-pytest-plugin-autoload: false` and accepts that risk.
#
# The judge is checked out from the Factory at the pinned commit of this
# workflow, never from the caller's tree.
name: JUnit gate

on:
  workflow_call:
    inputs:
      test-command:
        description: Shell command that runs the exam and writes the JUnit report to junit-file.
        type: string
        required: true
      junit-file:
        description: Path of the JUnit XML report, relative to the repository root.
        type: string
        required: false
        default: acceptance.xml
      timeout-minutes:
        description: Time limit of the exam job, in minutes.
        type: number
        required: false
        default: 10
      disable-pytest-plugin-autoload:
        description: Set PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 in the exam job, so a code commit cannot auto-register an installed pytest plugin that rewrites results.
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  exam:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      artifact-name: ${{ steps.name.outputs.value }}
    env:
      # A code commit could auto-register an installed pytest plugin (a pytest11 entry point).
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: ${{ inputs.disable-pytest-plugin-autoload && '1' || '' }}
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Name the report artifact (unique per call)
        id: name
        run: echo "value=junit-$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Run the exam
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -c "$TEST_COMMAND"
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.value }}
          path: ${{ inputs.junit-file }}
          if-no-files-found: ignore

  gate:
    needs: exam
    # always(): a run cancelled while the exam runs must not skip the gate,
    # because a skipped required check counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the judge at the pinned Factory commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-tools
          persist-credentials: false
      - name: Download the report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A fixed fallback name: an empty name would download every artifact
          # of the caller's run, so another call's report could be judged.
          name: ${{ needs.exam.outputs.artifact-name || 'no-exam-report' }}
          path: report
      - name: Require the report
        env:
          JUNIT_FILE: ${{ inputs.junit-file }}
          EXAM_RESULT: ${{ needs.exam.result }}
        run: |
          # A passing report from an exam command that then exited non-zero
          # (a coverage threshold, a second command) is not a pass.
          if [ "$EXAM_RESULT" != "success" ]; then
            echo "::error::the exam job ended with '$EXAM_RESULT', not success"
            exit 1
          fi
          if [ ! -f "report/${JUNIT_FILE##*/}" ]; then
            echo "::error::the exam job produced no report at $JUNIT_FILE"
            exit 1
          fi
      - name: JUnit gate (no missing, empty, skipped, failed or errored exam)
        env:
          JUNIT_FILE: ${{ inputs.junit-file }}
        run: /usr/bin/python3 -I .factory-tools/src/factory_tools/ci/junit_gate.py "report/${JUNIT_FILE##*/}"
