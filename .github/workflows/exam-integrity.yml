# Reusable exam-integrity check: no PR commit may change the exam (acceptance
# tests) together with the code or CI that judges it.
#
# By default the exam is the caller's top-level `tests/` (except `tests/unit`)
# and the CI surface is the Factory's own `src/factory_tools/ci/` and
# `.github/workflows/ci.yml`. A caller with another layout names its own paths
# (inputs added by #65):
#   exam-paths  globs of the exam files, replacing the default exam rule
#   ci-paths    globs of the CI surface, replacing the default CI surface
# Each input is one string holding one or more globs separated by whitespace
# or newlines (a YAML block scalar with one glob per line works). Globs are
# fnmatch style against the repo-relative path; `*` and `**` match across `/`.
# They are never expanded by the shell. Empty means the defaults.
#
# Caller (pull_request workflows only):
#   jobs:
#     exam-integrity:
#       uses: Shashkist/factory/.github/workflows/exam-integrity.yml@<commit-sha>
#       with:
#         exam-paths: "labs/*/tests/acceptance/**"
#         ci-paths: |
#           .github/workflows/lf-ci.yml
#           ci/**
#
# The judge is checked out from the Factory at the pinned commit of this
# workflow, never from the caller's tree.
name: Exam integrity

on:
  workflow_call:
    inputs:
      base-ref:
        description: Base branch to compare against. Empty means the base branch of the calling pull request.
        type: string
        required: false
        default: ""
      exam-paths:
        description: Globs (whitespace or newline separated) naming the exam files, for example "labs/*/tests/acceptance/**". Empty means the default rule, top-level tests/ except tests/unit.
        type: string
        required: false
        default: ""
      ci-paths:
        description: Globs (whitespace or newline separated) naming the CI surface that must not change together with the exam. Empty means the default, src/factory_tools/ci/ and .github/workflows/ci.yml.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  exam-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the judge at the pinned Factory commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .factory-tools
          persist-credentials: false
      - name: Exam integrity per commit
        env:
          BASE_REF: ${{ inputs.base-ref || github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXAM_PATHS: ${{ inputs.exam-paths }}
          CI_PATHS: ${{ inputs.ci-paths }}
        run: |
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::HEAD_SHA is empty: exam integrity runs on pull_request events only"
            exit 1
          fi
          if [ -z "$BASE_REF" ]; then
            echo "::error::BASE_REF is empty: exam integrity runs on pull_request events only"
            exit 1
          fi
          if ! git rev-parse --verify -q "origin/$BASE_REF" > /dev/null; then
            echo "::error::origin/$BASE_REF does not exist in the checkout"
            exit 1
          fi
          # Each input is one argv value; the judge splits it on whitespace, so
          # an input can never become a flag of its own.
          args=()
          if [ -n "${EXAM_PATHS//[[:space:]]/}" ]; then
            args+=("--exam-paths=$EXAM_PATHS")
          fi
          if [ -n "${CI_PATHS//[[:space:]]/}" ]; then
            args+=("--ci-paths=$CI_PATHS")
          fi
          /usr/bin/python3 -I .factory-tools/src/factory_tools/ci/exam_integrity.py "origin/$BASE_REF" "$HEAD_SHA" "${args[@]}"
