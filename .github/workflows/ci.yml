name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run. Pushes to main get a group
# per commit, so main runs never cancel or queue behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest tests/unit -q

  # The pin is a full SHA of main, so a PR runs main's judge, never its own (D25).
  # Move the pin with a PR when the judge on main changes.
  acceptance:
    uses: Shashkist/factory/.github/workflows/junit-gate.yml@34f9188d89b057f5cf753b3112e312a6689c88b2
    with:
      # Only the root pytest.ini (exam) configures the run; no addopts, and no
      # conftest/config picked up from above tests/.
      test-command: uv run pytest -c pytest.ini tests/acceptance -q -o addopts="" --confcutdir=tests --junitxml=acceptance.xml

  # Pinned to a full SHA of main for the same reason (D25).
  exam-integrity:
    if: github.event_name == 'pull_request'
    uses: Shashkist/factory/.github/workflows/exam-integrity.yml@34f9188d89b057f5cf753b3112e312a6689c88b2
