[project]
name = "factory-tools"
version = "0.1.0"
description = "Factory CI gates and tooling"
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
factory-tools = "factory_tools.cli:main"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
